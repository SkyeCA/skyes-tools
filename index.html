<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DialFace — Tools</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --text: #1b1d21;
    --sub: #5b6069;
    --accent: #3860ff;
    --accent-text: #ffffff;
    --border: #e2e4e9;
    --shadow: 0 1px 2px rgba(16, 18, 24, 0.06), 0 8px 24px rgba(16, 18, 24, 0.05);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14151a;
      --card-bg: #1d1f26;
      --text: #f0f1f4;
      --sub: #9aa0ac;
      --accent: #6d8bff;
      --accent-text: #0e1020;
      --border: #2b2e37;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 8px 24px rgba(0, 0, 0, 0.35);
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 6vh 20px;
  }

  main {
    width: 100%;
    max-width: 720px;
  }

  header {
    margin-bottom: 40px;
    text-align: center;
  }

  h1 {
    margin: 0 0 8px;
    font-size: 2rem;
    letter-spacing: -0.02em;
  }

  header p {
    margin: 0;
    color: var(--sub);
    font-size: 1rem;
  }

  #pages {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
  }

  .page-card {
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    padding: 20px 22px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: var(--text);
    transition: transform 0.12s ease, border-color 0.12s ease;
  }

  .page-card:hover,
  .page-card:focus-visible {
    transform: translateY(-2px);
    border-color: var(--accent);
    outline: none;
  }

  .page-card .icon {
    font-size: 1.6rem;
    line-height: 1;
  }

  .page-card .title {
    font-weight: 600;
    font-size: 1.05rem;
  }

  .page-card .desc {
    font-size: 0.88rem;
    color: var(--sub);
    line-height: 1.4;
  }

  .empty-state {
    text-align: center;
    color: var(--sub);
    padding: 40px 0;
  }

  footer {
    margin-top: 40px;
    text-align: center;
    font-size: 0.8rem;
    color: var(--sub);
  }
</style>
</head>
<body>
<main>
  <div id="pages"></div>

  <footer><a href="http://vore.my">SkyeCA</a></footer>
</main>

<script>
  // Add a new page by adding one entry here — no other changes needed.
  const PAGES = [
    {
      title: "Analog Meter Scale Designer",
      description: "Design and print basic analog dial scales.",
      href: "dial_face.html",
      icon: "🎛️"
    },
    {
      title: "Colour Picker",
      description: "Open an image, magnify, and click a pixel to read its colour.",
      href: "colour_picker.html",
      icon: "🎨"
    },
    {
      title: "Strip EXIF",
      description: "View an image's EXIF data and download a copy with it removed.",
      href: "strip_exif.html",
      icon: "🧹"
    },
    {
      title: "XMP Editor",
      description: "View and edit an image's XMP metadata, then save a modified copy.",
      href: "xmp_editor.html",
      icon: "🏷️"
    },
    {
      title: "4chan Image Converter",
      description: "Convert an image to a JPEG sized to fit under a file size limit.",
      href: "4chan_image_converter.html",
      icon: "📮"
    }
  ];

  const container = document.getElementById("pages");

  if (PAGES.length === 0) {
    container.innerHTML = '<p class="empty-state">No pages yet.</p>';
  } else {
    for (const page of PAGES) {
      const card = document.createElement("a");
      card.className = "page-card";
      card.href = page.href;

      const icon = document.createElement("div");
      icon.className = "icon";
      icon.textContent = page.icon || "📄";

      const title = document.createElement("div");
      title.className = "title";
      title.textContent = page.title;

      const desc = document.createElement("div");
      desc.className = "desc";
      desc.textContent = page.description || "";

      card.append(icon, title, desc);
      container.appendChild(card);
    }
  }
</script>
</body>
</html>
